<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#11111a">
  <title>HIGGSFIELD 2.0</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="brand"><div class="logo">✳</div><div><b>HIGGSFIELD 2.0</b><small>Independent AI workspace</small></div></div>
      <button id="clearBtn" class="ghost" title="Clear conversation">＋</button>
    </header>
    <main id="messages" aria-live="polite">
      <section class="welcome" id="welcome">
        <div class="orb">✳</div>
        <h1>One brain.<br><span>Many abilities.</span></h1>
        <p>Chat, plan, remember, and prepare image or video creations in one conversation.</p>
        <div class="suggestions">
          <button class="suggestion">Help me plan a cinematic video</button>
          <button class="suggestion">Create an image prompt from my idea</button>
          <button class="suggestion">Remember my character details</button>
        </div>
      </section>
    </main>
    <div class="composer-wrap">
      <div id="attachment" class="attachment hidden"></div>
      <div class="composer">
        <label class="attach" for="fileInput" aria-label="Attach reference">＋</label>
        <input id="fileInput" type="file" accept="image/*,video/*" hidden>
        <textarea id="prompt" rows="1" placeholder="Message HIGGSFIELD 2.0…"></textarea>
        <button id="sendBtn" class="send" aria-label="Send">↑</button>
      </div>
      <div class="toolbar">
        <span id="brainStatus">Local cognitive core · Memory on this device</span>
        <select id="mode" aria-label="Task type">
          <option value="auto">Auto</option><option value="image">Image</option><option value="video">Video</option><option value="chat">Chat</option>
        </select>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
